name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Mirrors the defaults in avia_nav/settings.py and django_app/compose.yaml.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: admin
      PGPASSWORD: test_password
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        run: pip install -r django_app/requirements.txt

      - name: Django system check
        working-directory: django_app
        run: python manage.py check

      - name: Fail if models changed without a migration
        working-directory: django_app
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to a fresh database
        working-directory: django_app
        run: python manage.py migrate

      - name: Run tests
        working-directory: django_app
        run: python manage.py test --verbosity 2

      - name: Byte-compile the scraper
        # web_scraper has no tests; this at least catches syntax/import breakage
        # in the code the API shells out to.
        run: python -m compileall -q web_scraper

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          # Build context is the project root so web_scraper/ lands in the image.
          context: .
          file: ./django_app/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f django_app/compose.yaml config --quiet

      - name: pgAdmin stays behind the "tools" profile
        run: |
          default_services=$(docker compose -f django_app/compose.yaml config --services | sort | tr '\n' ' ')
          echo "default services: $default_services"
          if echo "$default_services" | grep -q pgadmin; then
            echo "::error::pgadmin must not start by default — keep it in the 'tools' profile"
            exit 1
          fi
