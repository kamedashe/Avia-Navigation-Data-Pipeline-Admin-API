name: avia-nav-server-django

services:
  db:
    image: postgres:16
    container_name: avia_db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-admin}
      POSTGRES_PASSWORD: ${PGPASSWORD:-test_password}
      POSTGRES_DB: ${PGDATABASE:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-admin} -d ${PGDATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      # Build from the project root so web_scraper/ is available in the image.
      context: ..
      dockerfile: ./django_app/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable as "db".
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:-admin}
      PGPASSWORD: ${PGPASSWORD:-test_password}
      PGDATABASE: ${PGDATABASE:-postgres}
    volumes:
      - ../:/code
      - ../data:/code/data
      - ../processed_data:/code/processed_data
      - ../downloaded_data:/code/downloaded_data
    ports:
      - "5045:5045"
    command:
      - gunicorn
      - --chdir
      - django_app
      - -w
      - "4"
      - -k
      - gthread
      - --threads
      - "4"
      - --timeout
      - "600"
      - --bind
      - 0.0.0.0:5045
      - avia_nav.wsgi:application

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: avia_pgadmin
    restart: unless-stopped
    profiles: ["tools"]        # opt-in: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres_data:
